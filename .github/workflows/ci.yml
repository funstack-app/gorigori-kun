# Pre-merge gate: typecheck and build the Vite frontend on Linux, and
# `cargo check` the Tauri Rust crate on macOS (so platform-specific deps
# resolve). Runs on every PR and every push to main. Integration tests in
# src-tauri/tests/ require a real `codex` binary on PATH and are skipped here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build

  rust:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
