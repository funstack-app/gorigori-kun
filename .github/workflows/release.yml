# Builds release artifacts for the Tauri app and publishes them as a
# non-draft GitHub Release.
#
# Codex クロスレビュー (2026-05-19): draft release は
# `releases/latest/download/...` URL から取得できず、Tauri Updater が
# `latest.json` を読めない。non-draft で publish する。
#
# Targets:
#  - macOS Apple Silicon (.dmg)   [unsigned, requires xattr -cr after install]
#  - Windows x86_64 (.exe + .zip) [unsigned, includes bundled Codex CLI binaries]
#
# Triggered by:
#  - pushing a `v*` tag
#  - manually via workflow_dispatch with a `tag` input
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build the release for, e.g. v0.5.0'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # 出荷前ゲート: 既定モデルを同梱 CLI で実行できるかを検査する
  #
  # なぜ CI にも置くか (2026-07-26):
  #   scripts/release-checklist.sh からも同じ検査を呼んでいるが、
  #   チェックを走らせずにタグを push すればすり抜ける。
  #   実際に v2.0.0 / v2.1.0 は「既定モデルが 400 で必ず失敗する」状態で
  #   出荷され、発覚はユーザー報告まで9日かかった。
  #   ビルドの前に落とせば、壊れた配布物がリリースに上がることが構造的に無くなる。
  #
  #   ubuntu で 30 秒未満、依存は python3 だけ。ビルド 25分の前段としては安い。
  # ─────────────────────────────────────────────────────────────
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 既定モデル × 同梱 codex CLI の整合を検査
        run: python3 scripts/check-model-cli-match.py

  # ─────────────────────────────────────────────────────────────
  # macOS (.dmg) - Apple Silicon + Intel
  #
  # 経緯:
  #   v0.6.17 で Intel 対応のため matrix 化 → v2.0.0 (2026-07-25) で
  #   x86_64-apple-darwin を除外 → v2.3.0 (2026-07-28) で復活。
  #
  #   除外した理由は ort-sys 2.0.0-rc.12 の配布表 (build/download/dist.txt) から
  #   x86_64-apple-darwin が消え、「ort does not provide prebuilt binaries for
  #   the target」でビルドが落ちたこと。上流が Intel Mac サポートを落とした。
  #
  #   復活できた理由は、ort を **Windows 専用依存に格下げ** したから
  #   (src-tauri/Cargo.toml の [target.'cfg(target_os = "windows")'.dependencies])。
  #   ort を使うのは封印済みの編集機能群 (SAM2/SAM3/LaMa/BiRefNet/PP-OCR) だけで、
  #   Mac の背景透過は Vision (resources/removebg.swift) が担っている。
  #   つまり Mac は ort 無しでビルドでき、上流の配布終了に依存しなくなった。
  #   非 Windows では該当コマンドが「Windows 版のみ」を返すスタブに差し替わる
  #   (src-tauri/src/commands/edit_unsupported.rs)。
  #
  #   なお v1.2.0 の Intel 版 dmg がビルドできていたのは load-dynamic 有効時で、
  #   あれは実行時に dylib を探して無限ハングする構成だった (2026-06-18 に判明し除去)。
  # ─────────────────────────────────────────────────────────────
  macos:
    needs: preflight
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin   # Apple Silicon (M1/M2/M3/M4)
          - x86_64-apple-darwin    # Intel Mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      # v0.6.15 STΛCK 指示: Mac 配布版にも Codex CLI を同梱する。
      # v0.6.17: matrix で target に応じて aarch64 / x86_64 用 codex を取得。
      - name: Fetch Codex CLI binaries (macOS ${{ matrix.target }})
        run: |
          set -e
          # 2026-07-26: 0.131.0-alpha.19 (5/15ビルド) から 0.145.0 (安定版) へ更新。
          # 理由: 古い CLI は新モデル (gpt-5.6-sol 等) を知らず、指定されると
          #   400 invalid_request_error "requires a newer version of Codex"
          # で全件失敗する。Codex デスクトップを更新した人の ~/.codex/config.toml に
          # model = "gpt-5.6-sol" が書かれ、それを GORI の CODEX_HOME が引き継ぐため
          # 「Codex を更新した人だけが動かない」という分かりにくい形で発症した
          # (ユーザー報告 2026-07-26 で切り分け済み。手元で 0.145.0 なら通ることを実測)。
          # alpha は配布物に焼かない (prerelease=false の最新を選ぶ)。
          codexVer="rust-v0.145.0"
          base="https://github.com/openai/codex/releases/download/$codexVer"
          # matrix.target からファイル名を逆引き
          codex_arch="${{ matrix.target }}"
          mkdir -p src-tauri/resources

          # codex (CLI 本体)
          curl -L -o codex.tar.gz "$base/codex-${codex_arch}.tar.gz"
          mkdir -p tmp-codex
          tar -xzf codex.tar.gz -C tmp-codex
          find tmp-codex -type f -name "codex-${codex_arch}" -exec mv {} src-tauri/resources/codex \;
          if [ ! -f "src-tauri/resources/codex" ]; then
            echo "Failed to find codex-${codex_arch} in extracted tar"
            ls -la tmp-codex/
            exit 1
          fi
          chmod +x src-tauri/resources/codex
          rm -rf codex.tar.gz tmp-codex

          # codex-app-server (アプリが直接話す JSON-RPC サーバ)
          curl -L -o codex-app-server.tar.gz "$base/codex-app-server-${codex_arch}.tar.gz"
          mkdir -p tmp-app-server
          tar -xzf codex-app-server.tar.gz -C tmp-app-server
          find tmp-app-server -type f -name "codex-app-server-${codex_arch}" -exec mv {} src-tauri/resources/codex-app-server \;
          if [ ! -f "src-tauri/resources/codex-app-server" ]; then
            echo "Failed to find codex-app-server-${codex_arch}"
            ls -la tmp-app-server/
            exit 1
          fi
          chmod +x src-tauri/resources/codex-app-server
          rm -rf codex-app-server.tar.gz tmp-app-server

          # 確認
          ls -lh src-tauri/resources/codex src-tauri/resources/codex-app-server

      # tauri.conf.json の resources 配列に macOS 用 codex バイナリを追記
      - name: Patch tauri.conf.json for macOS bundle
        run: |
          set -e
          python3 <<'PYEOF'
          import json
          path = "src-tauri/tauri.conf.json"
          with open(path) as f:
              conf = json.load(f)
          existing = conf["bundle"].get("resources", [])
          additions = ["resources/codex", "resources/codex-app-server"]
          for a in additions:
              if a not in existing:
                  existing.append(a)
          conf["bundle"]["resources"] = existing
          with open(path, "w") as f:
              json.dump(conf, f, indent=2, ensure_ascii=False)
          print("✓ tauri.conf.json updated, resources:", existing)
          PYEOF

      # 2026-07-26: tauri-action をやめて素の build に切り替えた。
      #
      # なぜ: CI からリリースを作れない (組織設定で GITHUB_TOKEN が read 固定 /
      # RELEASE_PAT は期限切れ)。tauri-action で includeRelease: false にすると
      # 「公開もしないしビルドもしない」状態になり `No artifacts were found` で
      # 即終了した (実測: 1分で失敗)。ビルドと公開を分離し、ここではビルドだけ行う。
      # 成果物は次のステップで artifact にし、手元の権限で publish する。
      - name: Build (macOS ${{ matrix.target }})
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --target ${{ matrix.target }}

      # 2026-07-26: CI からリリースを作れないため、成果物を持ち出せるようにする。
      # 手元で `gh run download` して `gh release create` で publish する。
      - name: Upload build artifacts (macOS ${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          # 2026-07-26: Windows 側と同じ理由でディレクトリごと拾う。
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  # ─────────────────────────────────────────────────────────────
  # Windows x86_64 (.exe + .zip)
  # STΛCK 指示 (2026-05-15): 友達に渡して動かせる Windows 版を作る
  # ─────────────────────────────────────────────────────────────
  windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # Codex CLI Windows バイナリを公式 GitHub Releases から取得して
      # Tauri resources ディレクトリに配置する。これで Tauri が
      # アプリと一緒に同梱してくれる。
      - name: Fetch Codex CLI binaries (Windows x86_64)
        shell: pwsh
        run: |
          # macOS 側と同じ理由で更新 (2026-07-26)。両方を同じバージョンに保つ。
          $codexVer = "rust-v0.145.0"
          $base = "https://github.com/openai/codex/releases/download/$codexVer"

          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null

          # codex.exe (CLI 本体)
          # Codex 指摘 (2026-05-16): ファイル名を厳密一致で抽出。helper exe が
          # 同梱されている場合に誤検出して別バイナリを codex.exe としてリネーム
          # するのを防ぐ。
          Invoke-WebRequest -Uri "$base/codex-x86_64-pc-windows-msvc.exe.zip" -OutFile "codex.zip"
          Expand-Archive -Path "codex.zip" -DestinationPath "tmp-codex" -Force
          Get-ChildItem "tmp-codex" -Recurse |
            Where-Object { $_.Name -eq "codex-x86_64-pc-windows-msvc.exe" } |
            Select-Object -First 1 |
            ForEach-Object {
              Move-Item -Path $_.FullName -Destination "src-tauri/resources/codex.exe" -Force
            }
          if (-not (Test-Path "src-tauri/resources/codex.exe")) {
            Write-Error "Failed to find codex-x86_64-pc-windows-msvc.exe in extracted zip"
            exit 1
          }
          Remove-Item "codex.zip"
          Remove-Item "tmp-codex" -Recurse -Force

          # codex-app-server.exe (アプリが直接話す JSON-RPC サーバー)
          Invoke-WebRequest -Uri "$base/codex-app-server-x86_64-pc-windows-msvc.exe.zip" -OutFile "codex-app-server.zip"
          Expand-Archive -Path "codex-app-server.zip" -DestinationPath "tmp-app-server" -Force
          Get-ChildItem "tmp-app-server" -Recurse |
            Where-Object { $_.Name -eq "codex-app-server-x86_64-pc-windows-msvc.exe" } |
            Select-Object -First 1 |
            ForEach-Object {
              Move-Item -Path $_.FullName -Destination "src-tauri/resources/codex-app-server.exe" -Force
            }
          if (-not (Test-Path "src-tauri/resources/codex-app-server.exe")) {
            Write-Error "Failed to find codex-app-server-x86_64-pc-windows-msvc.exe in extracted zip"
            exit 1
          }
          Remove-Item "codex-app-server.zip"
          Remove-Item "tmp-app-server" -Recurse -Force

          Write-Host "✓ Codex binaries staged in src-tauri/resources/"
          Get-ChildItem "src-tauri/resources" | Format-Table Name, Length

      # tauri.conf.json の resources 配列に Windows 用 codex バイナリを追記
      - name: Patch tauri.conf.json for Windows bundle
        shell: pwsh
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $existing = @($conf.bundle.resources)
          $additions = @("resources/codex.exe", "resources/codex-app-server.exe")
          $conf.bundle.resources = $existing + $additions
          $conf | ConvertTo-Json -Depth 50 | Set-Content $confPath -Encoding UTF8
          Write-Host "✓ tauri.conf.json updated:"
          Get-Content $confPath | Select-String -Pattern "resources" -Context 0,5

      # 2026-07-26: mac 側と同じ理由で tauri-action をやめ、素の build にした。
      - name: Build (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      # 2026-07-26: mac 側と同じ理由で成果物を持ち出す。
      - name: Upload build artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          if-no-files-found: error
          retention-days: 7
          # 2026-07-26: 更新用ファイル (.nsis.zip / .sig) の取りこぼしを避けるため、
          # 拡張子を列挙せず bundle ディレクトリごと拾う。tauri のバージョンで
          # 出力先や命名が変わっても壊れない。
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.sig

  # ─────────────────────────────────────────────────────────────
  # Higgsfield 拡張パックは廃止 (MCP 方式へ移行済み)。
  # CLI バイナリ + Node 同梱の拡張パック配布は不要になったため、
  # higgsfield-extension-mac / higgsfield-extension-windows ジョブを削除した。
  # Higgsfield 連携はリモート HTTP MCP (codex mcp add) 経由で動く。
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # Updater manifest 集約 (Codex クロスレビュー 2026-05-19)
  #
  # 問題: 3 並列の platform job (mac aarch64 / mac x64 / windows) が
  # tauri-action の includeUpdaterJson: true で各々 latest.json を upsert する。
  # 最後に成功した 1 job の latest.json だけが残り、他 platform の署名が落ちる。
  #
  # 対策: 全 platform 完了後、リリースアセットから .sig を 1 個ずつ取得して
  # 統合 latest.json を生成・上書きする。これで全 platform の updater が動く。
  # ─────────────────────────────────────────────────────────────
  updater-manifest:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    # 2026-07-26: このジョブは「リリースが既に存在する」前提で .sig を集める。
    # 今は CI がリリースを作れない (組織設定で GITHUB_TOKEN が read 固定 /
    # RELEASE_PAT 期限切れ) ため、手元で publish した後に
    # `gh workflow run release.yml` の workflow_dispatch から回す。
    # タグ push では走らせない (リリース不在で必ず失敗するため)。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unified latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          # TAG は v0.9.5-windows-fix のような形。ビルド成果物のファイル名は
          # バージョン番号(0.9.5)だけで付くため、TAG_NUM もサフィックスを除いた
          # 純粋なバージョン番号にする。先頭 v を削り、最初の - 以降(-windows-fix
          # 等)を落とす。これをしないと latest.json の Windows URL が
          # GORI.GORI_0.9.5-windows-fix_x64-setup.exe を指して 404 になる
          # (2026-06-09 自動アップデート 404 の修正)。
          TAG_NO_V="${TAG#v}"
          TAG_NUM="${TAG_NO_V%%-*}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/assets.txt
          echo "== release assets =="
          cat /tmp/assets.txt

          fetch_sig() {
            local name="$1"
            gh release download "$TAG" -p "$name" -O - 2>/dev/null | tr -d '\n' || echo ""
          }

          # ── 配布プラットフォームの単一の正本 ───────────────────────────
          # 「Tauri の platform 名 | 更新用アーカイブ名」を1箇所で定義し、
          # 署名検証と latest.json 生成の両方をここから導出する。
          #
          # なぜ1箇所にまとめたか (2026-07-25):
          #   以前は検証ループと latest.json 本文が別々にプラットフォームを列挙して
          #   いた。片方だけ直すと「検証は Intel を必須にしているのに latest.json
          #   には出さない」「逆に latest.json に空署名だけ載る」というズレが生まれ、
          #   しかもどちらも CI 上は自然に見える。列挙を1本にすれば構造的に起きない。
          #
          # Intel Mac (darwin-x86_64) は v2.0.0 で除外し、v2.3.0 (2026-07-28) で復活した。
          # 復活の理由は macos job のコメント参照 (ort を Windows 専用依存に格下げし、
          # Mac が ort 無しでビルドできるようになったため)。
          #
          # アセット名は `npm run tauri build -- --target <triple>` の出力規約に従う。
          # 実測 (v1.2.0 = Intel と Apple Silicon の両方を出していた最後のリリース):
          #   GORI.GORI_aarch64.app.tar.gz / GORI.GORI_x64.app.tar.gz
          PLATFORMS=(
            "darwin-aarch64|GORI.GORI_aarch64.app.tar.gz"
            "darwin-x86_64|GORI.GORI_x64.app.tar.gz"
            "windows-x86_64|GORI.GORI_${TAG_NUM}_x64-setup.exe"
          )

          # 署名が1つでも欠けたら job を失敗させる (2026-07-25 修正)。
          #
          # なぜ warning から error に変えたか:
          #   以前は warning だったため、たとえば Windows の .sig だけ取得に失敗しても
          #   CI は緑で終わり、windows-x86_64.signature が空文字の latest.json が
          #   publish されていた。その状態で Windows ユーザーが更新ボタンを押すと
          #   署名検証に失敗し、生のエラー文言だけが出て永久に更新できない。
          #   しかも CI が成功しているのでリリース側は気づけず、
          #   「Mac は更新できて Windows だけ詰まる」という環境差の事故になる。
          #
          # ここで落ちた場合 latest.json は更新されないだけで、既存ユーザーは
          # 旧版のまま安全に留まる。これが正しい失敗の形。
          #
          # 長さも見る: minisign 署名は base64 で数百バイトになるため、
          # 極端に短い値は「取得できたが中身が壊れている」ケースを示す。
          MIN_SIG_BYTES=200
          SIG_ERROR=0
          PLATFORM_JSON=""

          echo "== signatures =="
          for entry in "${PLATFORMS[@]}"; do
            name="${entry%%|*}"
            asset="${entry#*|}"
            sig="$(fetch_sig "${asset}.sig")"
            url="https://github.com/${{ github.repository }}/releases/download/${TAG}/${asset}"

            echo "${name}: ${#sig} bytes (${asset})"

            if [ -z "$sig" ]; then
              echo "::error::${name} の .sig が取得できませんでした (${asset}.sig)"
              SIG_ERROR=1
            elif [ "${#sig}" -lt "$MIN_SIG_BYTES" ]; then
              echo "::error::${name} の .sig が短すぎます (${#sig} bytes < ${MIN_SIG_BYTES})"
              SIG_ERROR=1
            fi

            [ -n "$PLATFORM_JSON" ] && PLATFORM_JSON="${PLATFORM_JSON},"
            PLATFORM_JSON="${PLATFORM_JSON}
              \"${name}\": {
                \"signature\": \"${sig}\",
                \"url\": \"${url}\"
              }"
          done

          if [ "$SIG_ERROR" -ne 0 ]; then
            echo "::error::署名が揃わないため latest.json を publish しません (既存ユーザーは旧版のまま安全に留まります)"
            exit 1
          fi

          cat > /tmp/latest.json <<JSON
          {
            "version": "${TAG_NUM}",
            "notes": "GORI GORI KUN ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {${PLATFORM_JSON}
            }
          }
          JSON

          echo "== latest.json =="
          cat /tmp/latest.json

          # 生成した JSON が壊れていないことをここで確かめる。
          # 文字列連結で組んでいるため、署名に想定外の文字が混ざると
          # updater 側で初めて壊れが分かる (=ユーザーが踏む) 事故になりうる。
          python3 -c "import json,sys; d=json.load(open('/tmp/latest.json')); \
            ps=d['platforms']; \
            print('platforms:', ', '.join(sorted(ps))); \
            sys.exit(0 if ps else 1)"

      - name: Upload latest.json to release (overwrite)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: /tmp/latest.json
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          # リリースノートを必ず入れる (2026-07-25 追加)。
          #
          # なぜ: v1.2.0 は本文0文字で publish されていた。未署名アプリなので
          # 初回起動が OS に止められるのに、ダウンロードページに回避手順が
          # 1文字も書かれていない状態だった。非エンジニアは「壊れたアプリを
          # 配られた」と判断してそこで離脱する = 配布ブロッカー。
          # 手順を手で書き忘れる余地を消すため、CI で必ず本文を入れる。
          # append_body: true なので、手で書いた説明があればその下に付く。
          append_body: true
          body: |
            ## ダウンロード

            | 環境 | ファイル |
            |---|---|
            | Mac (Apple Silicon / M1〜M4) | `..._aarch64.dmg` |
            | Mac (Intel) | `..._x64.dmg` |
            | Windows 10 / 11 | `..._x64-setup.exe` |

            Mac がどちらか分からない場合: アップルマーク → 「このMacについて」 → 「チップ」を確認。
            **Apple M1〜M4** なら Apple Silicon、**Intel Core** なら Intel です。
            macOS は 12 (Monterey) 以降が必要です。

            ## 初回起動だけ、OS の確認画面が出ます

            開発元の登録をしていないため、**初回だけ** OS が確認してきます。
            **故障ではありません。** 下の手順で開けば2回目以降は普通に起動します。

            ### Mac (macOS 15 Sequoia 以降)

            1. アプリをダブルクリック（「開けません」と出ます。閉じてOK）
            2. アップルマーク → **システム設定** → **プライバシーとセキュリティ**
            3. 下にスクロールし「"GORI GORI" は開発元を確認できないため…」の横の
               **「このまま開く」** を押す
            4. パスワードを入れると起動します

            ### Mac (macOS 12〜14)

            1. アプリを **右クリック**（control + クリック）
            2. **「開く」** を選ぶ → 確認ダイアログでもう一度 **「開く」**

            ダブルクリックでは開けません。右クリックから開くのがポイントです。

            ### Windows

            1. setup.exe をダブルクリック
            2. 「WindowsによってPCが保護されました」→ **「詳細情報」** を押す
            3. **「実行」** を押す

            管理者権限は不要です。

            ## アップデート

            既にお使いの方は、アプリ内の **設定 → 基本 → アップデート** から
            「更新を確認」を押すだけで最新版になります。
            作品データ・プリセット・設定は引き継がれます。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
