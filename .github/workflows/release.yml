# Builds release artifacts for the Tauri app and uploads them as a draft
# GitHub Release.
#
# Targets:
#  - macOS Apple Silicon (.dmg)   [unsigned, requires xattr -cr after install]
#  - Windows x86_64 (.exe + .zip) [unsigned, includes bundled Codex CLI binaries]
#
# Triggered by:
#  - pushing a `v*` tag
#  - manually via workflow_dispatch with a `tag` input
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build the release for, e.g. v0.5.0'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # macOS Apple Silicon (.dmg)
  # ─────────────────────────────────────────────────────────────
  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # v0.6.15 STΛCK 指示: Mac 配布版にも Codex CLI を同梱する。
      # 従来 Windows job だけ codex を同梱していたため、Mac ユーザは
      # 「codex バイナリが見つかりません」エラーで起動できなかった。
      - name: Fetch Codex CLI binaries (macOS aarch64)
        run: |
          set -e
          codexVer="rust-v0.131.0-alpha.19"
          base="https://github.com/openai/codex/releases/download/$codexVer"
          mkdir -p src-tauri/resources

          # codex (CLI 本体) - aarch64-apple-darwin
          curl -L -o codex.tar.gz "$base/codex-aarch64-apple-darwin.tar.gz"
          mkdir -p tmp-codex
          tar -xzf codex.tar.gz -C tmp-codex
          # 名前を 'codex' に統一して resources/ に配置
          find tmp-codex -type f -name "codex-aarch64-apple-darwin" -exec mv {} src-tauri/resources/codex \;
          if [ ! -f "src-tauri/resources/codex" ]; then
            echo "Failed to find codex-aarch64-apple-darwin in extracted tar"
            ls -la tmp-codex/
            exit 1
          fi
          chmod +x src-tauri/resources/codex
          rm -rf codex.tar.gz tmp-codex

          # codex-app-server (アプリが直接話す JSON-RPC サーバ)
          curl -L -o codex-app-server.tar.gz "$base/codex-app-server-aarch64-apple-darwin.tar.gz"
          mkdir -p tmp-app-server
          tar -xzf codex-app-server.tar.gz -C tmp-app-server
          find tmp-app-server -type f -name "codex-app-server-aarch64-apple-darwin" -exec mv {} src-tauri/resources/codex-app-server \;
          if [ ! -f "src-tauri/resources/codex-app-server" ]; then
            echo "Failed to find codex-app-server-aarch64-apple-darwin"
            ls -la tmp-app-server/
            exit 1
          fi
          chmod +x src-tauri/resources/codex-app-server
          rm -rf codex-app-server.tar.gz tmp-app-server

          # 確認
          ls -lh src-tauri/resources/codex src-tauri/resources/codex-app-server

      # tauri.conf.json の resources 配列に macOS 用 codex バイナリを追記
      - name: Patch tauri.conf.json for macOS bundle
        run: |
          set -e
          python3 <<'PYEOF'
          import json
          path = "src-tauri/tauri.conf.json"
          with open(path) as f:
              conf = json.load(f)
          existing = conf["bundle"].get("resources", [])
          additions = ["resources/codex", "resources/codex-app-server"]
          for a in additions:
              if a not in existing:
                  existing.append(a)
          conf["bundle"]["resources"] = existing
          with open(path, "w") as f:
              json.dump(conf, f, indent=2, ensure_ascii=False)
          print("✓ tauri.conf.json updated, resources:", existing)
          PYEOF

      - name: Build and publish draft release (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'GORI GORI KUN ${{ inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeRelease: true
          includeUpdaterJson: false
          args: '--target aarch64-apple-darwin'

  # ─────────────────────────────────────────────────────────────
  # Windows x86_64 (.exe + .zip)
  # STΛCK 指示 (2026-05-15): 友達に渡して動かせる Windows 版を作る
  # ─────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # Codex CLI Windows バイナリを公式 GitHub Releases から取得して
      # Tauri resources ディレクトリに配置する。これで Tauri が
      # アプリと一緒に同梱してくれる。
      - name: Fetch Codex CLI binaries (Windows x86_64)
        shell: pwsh
        run: |
          $codexVer = "rust-v0.131.0-alpha.19"
          $base = "https://github.com/openai/codex/releases/download/$codexVer"

          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null

          # codex.exe (CLI 本体)
          # Codex 指摘 (2026-05-16): ファイル名を厳密一致で抽出。helper exe が
          # 同梱されている場合に誤検出して別バイナリを codex.exe としてリネーム
          # するのを防ぐ。
          Invoke-WebRequest -Uri "$base/codex-x86_64-pc-windows-msvc.exe.zip" -OutFile "codex.zip"
          Expand-Archive -Path "codex.zip" -DestinationPath "tmp-codex" -Force
          Get-ChildItem "tmp-codex" -Recurse |
            Where-Object { $_.Name -eq "codex-x86_64-pc-windows-msvc.exe" } |
            Select-Object -First 1 |
            ForEach-Object {
              Move-Item -Path $_.FullName -Destination "src-tauri/resources/codex.exe" -Force
            }
          if (-not (Test-Path "src-tauri/resources/codex.exe")) {
            Write-Error "Failed to find codex-x86_64-pc-windows-msvc.exe in extracted zip"
            exit 1
          }
          Remove-Item "codex.zip"
          Remove-Item "tmp-codex" -Recurse -Force

          # codex-app-server.exe (アプリが直接話す JSON-RPC サーバー)
          Invoke-WebRequest -Uri "$base/codex-app-server-x86_64-pc-windows-msvc.exe.zip" -OutFile "codex-app-server.zip"
          Expand-Archive -Path "codex-app-server.zip" -DestinationPath "tmp-app-server" -Force
          Get-ChildItem "tmp-app-server" -Recurse |
            Where-Object { $_.Name -eq "codex-app-server-x86_64-pc-windows-msvc.exe" } |
            Select-Object -First 1 |
            ForEach-Object {
              Move-Item -Path $_.FullName -Destination "src-tauri/resources/codex-app-server.exe" -Force
            }
          if (-not (Test-Path "src-tauri/resources/codex-app-server.exe")) {
            Write-Error "Failed to find codex-app-server-x86_64-pc-windows-msvc.exe in extracted zip"
            exit 1
          }
          Remove-Item "codex-app-server.zip"
          Remove-Item "tmp-app-server" -Recurse -Force

          Write-Host "✓ Codex binaries staged in src-tauri/resources/"
          Get-ChildItem "src-tauri/resources" | Format-Table Name, Length

      # tauri.conf.json の resources 配列に Windows 用 codex バイナリを追記
      - name: Patch tauri.conf.json for Windows bundle
        shell: pwsh
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $existing = @($conf.bundle.resources)
          $additions = @("resources/codex.exe", "resources/codex-app-server.exe")
          $conf.bundle.resources = $existing + $additions
          $conf | ConvertTo-Json -Depth 50 | Set-Content $confPath -Encoding UTF8
          Write-Host "✓ tauri.conf.json updated:"
          Get-Content $confPath | Select-String -Pattern "resources" -Context 0,5

      - name: Build and publish draft release (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'GORI GORI KUN ${{ inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeRelease: true
          includeUpdaterJson: false
          args: '--target x86_64-pc-windows-msvc'
