# Builds release artifacts for the Tauri app and uploads them as a draft
# GitHub Release.
#
# Targets:
#  - macOS Apple Silicon (.dmg)   [unsigned, requires xattr -cr after install]
#  - Windows x86_64 (.exe + .zip) [unsigned, includes bundled Codex CLI binaries]
#
# Triggered by:
#  - pushing a `v*` tag
#  - manually via workflow_dispatch with a `tag` input
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build the release for, e.g. v0.5.0'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # macOS (.dmg) - Apple Silicon + Intel の 2ターゲット並列ビルド
  # v0.6.17 STΛCK 指示: Intel Mac 対応のため matrix 化。
  # ─────────────────────────────────────────────────────────────
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin   # Apple Silicon (M1/M2/M3/M4)
          - x86_64-apple-darwin    # Intel Mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      # v0.6.15 STΛCK 指示: Mac 配布版にも Codex CLI を同梱する。
      # v0.6.17: matrix で target に応じて aarch64 / x86_64 用 codex を取得。
      - name: Fetch Codex CLI binaries (macOS ${{ matrix.target }})
        run: |
          set -e
          codexVer="rust-v0.131.0-alpha.19"
          base="https://github.com/openai/codex/releases/download/$codexVer"
          # matrix.target からファイル名を逆引き
          codex_arch="${{ matrix.target }}"
          mkdir -p src-tauri/resources

          # codex (CLI 本体)
          curl -L -o codex.tar.gz "$base/codex-${codex_arch}.tar.gz"
          mkdir -p tmp-codex
          tar -xzf codex.tar.gz -C tmp-codex
          find tmp-codex -type f -name "codex-${codex_arch}" -exec mv {} src-tauri/resources/codex \;
          if [ ! -f "src-tauri/resources/codex" ]; then
            echo "Failed to find codex-${codex_arch} in extracted tar"
            ls -la tmp-codex/
            exit 1
          fi
          chmod +x src-tauri/resources/codex
          rm -rf codex.tar.gz tmp-codex

          # codex-app-server (アプリが直接話す JSON-RPC サーバ)
          curl -L -o codex-app-server.tar.gz "$base/codex-app-server-${codex_arch}.tar.gz"
          mkdir -p tmp-app-server
          tar -xzf codex-app-server.tar.gz -C tmp-app-server
          find tmp-app-server -type f -name "codex-app-server-${codex_arch}" -exec mv {} src-tauri/resources/codex-app-server \;
          if [ ! -f "src-tauri/resources/codex-app-server" ]; then
            echo "Failed to find codex-app-server-${codex_arch}"
            ls -la tmp-app-server/
            exit 1
          fi
          chmod +x src-tauri/resources/codex-app-server
          rm -rf codex-app-server.tar.gz tmp-app-server

          # 確認
          ls -lh src-tauri/resources/codex src-tauri/resources/codex-app-server

      # tauri.conf.json の resources 配列に macOS 用 codex バイナリを追記
      - name: Patch tauri.conf.json for macOS bundle
        run: |
          set -e
          python3 <<'PYEOF'
          import json
          path = "src-tauri/tauri.conf.json"
          with open(path) as f:
              conf = json.load(f)
          existing = conf["bundle"].get("resources", [])
          additions = ["resources/codex", "resources/codex-app-server"]
          for a in additions:
              if a not in existing:
                  existing.append(a)
          conf["bundle"]["resources"] = existing
          with open(path, "w") as f:
              json.dump(conf, f, indent=2, ensure_ascii=False)
          print("✓ tauri.conf.json updated, resources:", existing)
          PYEOF

      - name: Build and publish draft release (macOS ${{ matrix.target }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'GORI GORI KUN ${{ inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeRelease: true
          includeUpdaterJson: false
          args: '--target ${{ matrix.target }}'

  # ─────────────────────────────────────────────────────────────
  # Windows x86_64 (.exe + .zip)
  # STΛCK 指示 (2026-05-15): 友達に渡して動かせる Windows 版を作る
  # ─────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # Codex CLI Windows バイナリを公式 GitHub Releases から取得して
      # Tauri resources ディレクトリに配置する。これで Tauri が
      # アプリと一緒に同梱してくれる。
      - name: Fetch Codex CLI binaries (Windows x86_64)
        shell: pwsh
        run: |
          $codexVer = "rust-v0.131.0-alpha.19"
          $base = "https://github.com/openai/codex/releases/download/$codexVer"

          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null

          # codex.exe (CLI 本体)
          # Codex 指摘 (2026-05-16): ファイル名を厳密一致で抽出。helper exe が
          # 同梱されている場合に誤検出して別バイナリを codex.exe としてリネーム
          # するのを防ぐ。
          Invoke-WebRequest -Uri "$base/codex-x86_64-pc-windows-msvc.exe.zip" -OutFile "codex.zip"
          Expand-Archive -Path "codex.zip" -DestinationPath "tmp-codex" -Force
          Get-ChildItem "tmp-codex" -Recurse |
            Where-Object { $_.Name -eq "codex-x86_64-pc-windows-msvc.exe" } |
            Select-Object -First 1 |
            ForEach-Object {
              Move-Item -Path $_.FullName -Destination "src-tauri/resources/codex.exe" -Force
            }
          if (-not (Test-Path "src-tauri/resources/codex.exe")) {
            Write-Error "Failed to find codex-x86_64-pc-windows-msvc.exe in extracted zip"
            exit 1
          }
          Remove-Item "codex.zip"
          Remove-Item "tmp-codex" -Recurse -Force

          # codex-app-server.exe (アプリが直接話す JSON-RPC サーバー)
          Invoke-WebRequest -Uri "$base/codex-app-server-x86_64-pc-windows-msvc.exe.zip" -OutFile "codex-app-server.zip"
          Expand-Archive -Path "codex-app-server.zip" -DestinationPath "tmp-app-server" -Force
          Get-ChildItem "tmp-app-server" -Recurse |
            Where-Object { $_.Name -eq "codex-app-server-x86_64-pc-windows-msvc.exe" } |
            Select-Object -First 1 |
            ForEach-Object {
              Move-Item -Path $_.FullName -Destination "src-tauri/resources/codex-app-server.exe" -Force
            }
          if (-not (Test-Path "src-tauri/resources/codex-app-server.exe")) {
            Write-Error "Failed to find codex-app-server-x86_64-pc-windows-msvc.exe in extracted zip"
            exit 1
          }
          Remove-Item "codex-app-server.zip"
          Remove-Item "tmp-app-server" -Recurse -Force

          Write-Host "✓ Codex binaries staged in src-tauri/resources/"
          Get-ChildItem "src-tauri/resources" | Format-Table Name, Length

      # tauri.conf.json の resources 配列に Windows 用 codex バイナリを追記
      - name: Patch tauri.conf.json for Windows bundle
        shell: pwsh
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $existing = @($conf.bundle.resources)
          $additions = @("resources/codex.exe", "resources/codex-app-server.exe")
          $conf.bundle.resources = $existing + $additions
          $conf | ConvertTo-Json -Depth 50 | Set-Content $confPath -Encoding UTF8
          Write-Host "✓ tauri.conf.json updated:"
          Get-Content $confPath | Select-String -Pattern "resources" -Context 0,5

      - name: Build and publish draft release (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'GORI GORI KUN ${{ inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeRelease: true
          includeUpdaterJson: false
          args: '--target x86_64-pc-windows-msvc'

  # ─────────────────────────────────────────────────────────────
  # Higgsfield 拡張パック (Mac aarch64 + Mac x64)
  # v0.6.19 STΛCK 指示:
  # 別配布の拡張パックで Node.js + higgsfield CLI を提供。
  # ユーザーは GORI 本体 + この拡張パック の 2 つを /Applications にD&D
  # するだけで Higgsfield 機能が使えるようになる。
  # ─────────────────────────────────────────────────────────────
  higgsfield-extension-mac:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (build用)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Higgsfield extension (${{ matrix.arch }})
        run: |
          chmod +x scripts/build-higgsfield-extension.sh
          ./scripts/build-higgsfield-extension.sh ${{ matrix.arch }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/GORI-HiggsField-Extension_mac-${{ matrix.arch }}.dmg
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Higgsfield 拡張パック (Windows x64)
  # ─────────────────────────────────────────────────────────────
  higgsfield-extension-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (build用)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Higgsfield extension (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nodeVersion = "v20.18.0"
          $nodeArch = "x64"
          $hfPkg = "@higgsfield/cli"
          $workDir = "$pwd\_work\higgsfield-extension-windows"
          $distDir = "$pwd\dist"
          $extDir = "$workDir\payload\higgsfield"

          Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$extDir\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$extDir\node_modules" | Out-Null
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          # Node.js Windows zip 取得
          $nodeZip = "node-$nodeVersion-win-$nodeArch.zip"
          $nodeUrl = "https://nodejs.org/dist/$nodeVersion/$nodeZip"
          Write-Host "==> Download $nodeUrl"
          Invoke-WebRequest -Uri $nodeUrl -OutFile "$workDir\$nodeZip"
          Expand-Archive -Path "$workDir\$nodeZip" -DestinationPath $workDir -Force
          $nodeRoot = "$workDir\node-$nodeVersion-win-$nodeArch"
          Copy-Item "$nodeRoot\node.exe" "$extDir\bin\node.exe"
          # npm は node_modules\npm
          Copy-Item -Recurse "$nodeRoot\node_modules\npm" "$extDir\node_modules\"

          # higgsfield CLI を npm install
          Write-Host "==> npm install $hfPkg"
          & "$extDir\bin\node.exe" "$extDir\node_modules\npm\bin\npm-cli.js" install --prefix "$extDir" $hfPkg --no-save --no-audit --no-fund --quiet

          # higgsfield ラッパー (.cmd)
          $hfBin = Get-ChildItem -Path "$extDir\node_modules\@higgsfield\cli" -Filter "higgsfield.js" -Recurse | Select-Object -First 1
          if (-not $hfBin) {
              Write-Error "higgsfield.js が見つかりません"
              exit 1
          }
          # 拡張パック内の相対パスにする
          $hfRel = $hfBin.FullName.Substring($extDir.Length + 1).Replace("\", "\\")
          $wrapperContent = @"
@echo off
setlocal
set "EXT_ROOT=%~dp0.."
"%EXT_ROOT%\bin\node.exe" "%EXT_ROOT%\$hfRel" %*
"@
          Set-Content -Path "$extDir\bin\higgsfield.cmd" -Value $wrapperContent -NoNewline

          # README
          @"
GORI GORI KUN - Higgsfield 拡張パック (Windows)
================================================

このフォルダごと、以下の場所にコピーしてください:
  %APPDATA%\app.codexframefactory\extensions\

または同梱のインストーラ.bat をダブルクリックして自動配置できます。
"@ | Set-Content -Path "$workDir\payload\README.txt" -NoNewline

          # 自動インストーラ .bat
          $installerContent = @"
@echo off
setlocal
set "SRC=%~dp0higgsfield"
set "DEST=%APPDATA%\app.codexframefactory\extensions"
if not exist "%DEST%" mkdir "%DEST%"
echo Installing Higgsfield extension to %DEST%\higgsfield ...
if exist "%DEST%\higgsfield" rmdir /S /Q "%DEST%\higgsfield"
xcopy /E /I /Y "%SRC%" "%DEST%\higgsfield" >nul
echo.
echo OK! GORI GORI KUN を再起動してください。
pause
"@
          Set-Content -Path "$workDir\payload\install.bat" -Value $installerContent -NoNewline

          # zip 化
          $zipPath = "$distDir\GORI-HiggsField-Extension_windows.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          Compress-Archive -Path "$workDir\payload\*" -DestinationPath $zipPath
          Write-Host "Built: $zipPath"
          Get-Item $zipPath | Format-Table Name, Length

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/GORI-HiggsField-Extension_windows.zip
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
