[package]
name = "gori-gori-kun"
version = "0.9.2"
description = "GORI GORI KUN — Creative storyboard & image generation desktop app"
authors = ["STΛCK"]
edition = "2021"
license = "MIT"

[lib]
name = "codex_frame_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
zip = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "copy-dylibs", "download-binaries"] }
ort-sys = { version = "2.0.0-rc.12" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

dirs = "5"
once_cell = "1"
notify = "6"
notify-debouncer-full = "0.3"
which = "7"
tempfile = "3"
font-kit = "0.14"

[dev-dependencies]
tempfile = "3"
